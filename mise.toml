# Toolchain and tasks for a shared laenen-ai module.
#
# This file is the single source of tool versions. CI installs mise and runs
# `mise run check`; it does not pin the toolchain a second time in workflow YAML.

[tools]
go            = "1.26.5"
golangci-lint = "2.11.4"
gofumpt       = "0.9.2"
buf           = "1.75.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.11"
"go:github.com/laenenai/es-lite/cmd/protoc-gen-es-lite" = "v0.6.0"

[env]
CGO_ENABLED = "0"

[tasks.fmt]
run = "gofumpt -l -w $(find . -path ./.claude -prune -o -path ./gen -prune -o -name '*.go' -print)"

[tasks.fmt-check]
run = "test -z \"$(gofumpt -l $(find . -path ./.claude -prune -o -path ./gen -prune -o -name '*.go' -print))\""

[tasks.lint]
run = "golangci-lint run"

[tasks.test]
description = "Inner loop: no containers, no databases. Skips at run time, never behind a build tag."
run = "go test ./... -short"

[tasks.build]
description = "Proves the shipped binary is cgo-free: inherits CGO_ENABLED=0 from [env]."
run = "go build ./..."

[tasks.test-all]
description = "Full race suite for the published root module."
# CGO_ENABLED=0 is a *release* constraint (cgo-free, cross-compilable binary),
# not a test constraint. The race detector needs cgo, and race detection is
# worth more in tests than cgo-freedom is; the cgo-free property is verified by
# the `build` task, which `check` also depends on.
#
# The nested module under docs/superpowers/spikes is a throwaway spike, not a
# published module; it is deliberately outside this gate and is never released.
env = { CGO_ENABLED = "1" }
run = "go test ./... -race"

[tasks.generate]
description = "Lint the protobuf contracts and regenerate Go code."
run = "buf lint && buf generate"

[tasks.generate-check]
description = "Fail if checked-in generated code is stale."
run = "mise run generate && git diff --exit-code -- gen && test -z \"$(git ls-files --others --exclude-standard -- gen)\""

[tasks.vuln]
description = "Report reachable Go vulnerabilities."
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks.api-diff]
description = "Compare the importable API with the last root tag using apidiff."
run = "bash scripts/api-diff.sh"

[tasks.release-check]
description = "Validate a clean release tree with gorelease (run from a clean checkout)."
run = "go run golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e -base=latest"

[tasks.check]
depends = ["fmt-check", "lint", "build", "test-all", "generate-check", "vuln", "api-diff"]
