# sqlc generates this module's query layer. CONVENTIONS makes sqlc the
# default and hand-written SQL the departure that needs a reason; the one
# reason that still holds here is SQL composed at runtime, which has no
# fixed statement to generate (see internal/registry/pgregistry's package
# doc).
#
# Schema and queries are read from the same files the module ships: the
# goose migrations in db/migrations are the schema sqlc type-checks every
# statement against, so a query naming a column that does not exist, or
# binding a parameter of the wrong type, fails at generation time rather
# than against a database.
version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "gen"
        out: "internal/registry/pgregistry/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          # ---------------------------------------------------------------
          # The two base mappings every column in this schema starts from.
          # ---------------------------------------------------------------
          #
          # iam.ulid is a DOMAIN over text (00001_init.sql), so without this
          # sqlc has no Go type for it at all and a nullable one lands as
          # interface{}. string is the honest primitive; the column
          # overrides below refine each one to its typed domain id.
          - db_type: "iam.ulid"
            go_type: "string"
          - db_type: "iam.ulid"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          # time.Time, not pgtype.Timestamptz: internal/domain's instants
          # are time.Time, and a generated layer handing back a pgtype
          # wrapper would put a pgx type in every conversion in the
          # adapter. A nullable column becomes *time.Time, which is the
          # shape the adapter already reads (a zero time.Time means
          # "absent" in the domain, and NULL is how that is stored).
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

          # ---------------------------------------------------------------
          # Typed ids and typed enums, following cas/sqlc.yaml.
          # ---------------------------------------------------------------
          #
          # Every id column maps to its internal/domain typed id, never a
          # bare string: that is the whole point of the typed ids (they
          # cannot be crossed at a call site), and a generated layer
          # handing back string would undo it right at the boundary. The
          # text-valued enum columns map to their typed domain enums for
          # the same reason.
          - column: "iam.principals.id"
            go_type:
              import: "github.com/laenenai/iam/internal/domain"
              type: "PrincipalID"
          - column: "iam.principals.tenant_id"
            go_type:
              import: "github.com/laenenai/iam/internal/domain"
              type: "TenantID"
          - column: "iam.principals.kind"
            go_type:
              import: "github.com/laenenai/iam/internal/domain"
              type: "PrincipalKind"
          # delegated_by is NULL for everything but an agent run, so it is
          # the typed id behind a pointer rather than the id itself.
          - column: "iam.principals.delegated_by"
            go_type:
              import: "github.com/laenenai/iam/internal/domain"
              type: "PrincipalID"
              pointer: true

          - column: "iam.groups.id"
            go_type:
              import: "github.com/laenenai/iam/internal/domain"
              type: "GroupID"
          - column: "iam.groups.tenant_id"
            go_type:
              import: "github.com/laenenai/iam/internal/domain"
              type: "TenantID"

          - column: "iam.group_members.group_id"
            go_type:
              import: "github.com/laenenai/iam/internal/domain"
              type: "GroupID"
          - column: "iam.group_members.principal_id"
            go_type:
              import: "github.com/laenenai/iam/internal/domain"
              type: "PrincipalID"
          - column: "iam.group_members.source"
            go_type:
              import: "github.com/laenenai/iam/internal/domain"
              type: "GroupSource"

          # There was a block here for the one column that was deliberately
          # NOT its domain type: a clearance group's id, which was a struct
          # with an unexported field so that no package outside
          # internal/domain could forge one or convert a GroupID into one.
          # Mapping it would have needed sql.Scanner and driver.Valuer —
          # both exported — so it mapped to its primitive instead and
          # pgregistry converted through the validating parser at its own
          # boundary.
          #
          # The type went with the mandatory tier (design anti-goal A3) and
          # the overrides went with it. CONVENTIONS.md keeps the technique,
          # because the next value that must be unforgeable will need it.

          # The view is the artifact design §9's predicate joins, not
          # something this package queries from Go; its columns are typed
          # here anyway so models.go describes the schema uniformly.
          - column: "iam.live_group_members.principal_id"
            go_type:
              import: "github.com/laenenai/iam/internal/domain"
              type: "PrincipalID"
          - column: "iam.live_group_members.group_id"
            go_type:
              import: "github.com/laenenai/iam/internal/domain"
              type: "GroupID"
          - column: "iam.live_group_members.source"
            go_type:
              import: "github.com/laenenai/iam/internal/domain"
              type: "GroupSource"
